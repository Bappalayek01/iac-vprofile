name: "Vprofile IAC"
on:
  push:
    branches:
      - main
      - stage
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AWS_REGION: us-east-1
  EKS_CLUSTER: vprofile-eks

jobs:
  terraform:
    name: "Apply terraform code changes"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform with specified version on the runner
        uses: hashicorp/setup-terraform@v2
        #with:
          #terraform_version: 1.5.0

      - name: Initialize Terraform
        id: init
        run: terraform init -backend-config="bucket=${{ secrets.BUCKET_TF_STATE }}"
      
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check   

      - name: Validate Terraform
        id: validate  
        run: terraform validate

      - name: Plan Terraform
        id: plan
        run: terraform plan -no-color -input=false -out=planfile
        continue-on-error: true
        # This will allow the workflow to continue even if the plan fails

      - name: Terraform plan status
        if: steps.plan.outcome == 'failure'
        run: |
          echo "Terraform plan failed. Exiting with error."
          exit 1
        # This will allow the workflow to continue even if the plan fails
    

      #- name: Apply Terraform
        #id: apple
        #if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        #run: terraform apply -input=false -auto-approve -parallelism=1 planfile
        # This will apply the changes only if the branch is main and the event is a push
        # This will apply the changes only if the branch is main and the event is a push

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Configure kubeconfig
        id: getconfig
        if: steps.apple.outcome == 'success'
        run: |
          aws eks --region ${{ env.AWS_REGION }} update-kubeconfig --name ${{ env.EKS_CLUSTER }}

     # - name: Setup Ingress controller
      #  id: setup-ingress
      #  if: steps.apple.outcome == 'success' && steps.getconfig.outcome == 'success'
      #  run: |
      #    kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.1.3/deploy/static/provider/aws/deploy.yaml